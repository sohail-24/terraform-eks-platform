name: 🔥 EKS ZERO-MANUAL DESTROY PIPELINE

on:
  workflow_dispatch:

concurrency:
  group: eks-destroy-main
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      AWS_REGION: ap-south-1
      CLUSTER_NAME: aws_eks-eks
      NODEGROUP_NAME: aws_eks-eks-nodes

    steps:

    - uses: actions/checkout@v4
    - uses: hashicorp/setup-terraform@v3
    - uses: azure/setup-kubectl@v4

    - uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    # -------------------------------
    # TERRAFORM INIT
    # -------------------------------
    - name: Terraform Init
      run: terraform init

    # -------------------------------
    # CONNECT CLUSTER (OPTIONAL)
    # -------------------------------
    - name: Configure kubeconfig
      continue-on-error: true
      run: |
        aws eks update-kubeconfig \
          --region $AWS_REGION \
          --name $CLUSTER_NAME || true

    # -------------------------------
    # DELETE APPLICATION (ARGO)
    # -------------------------------
    - name: Delete ArgoCD Application
      continue-on-error: true
      run: |
        kubectl delete application django-ecommerce -n argocd || true

    # -------------------------------
    # DELETE APP NAMESPACE
    # -------------------------------
    - name: Delete Ecommerce Namespace
      continue-on-error: true
      run: |
        kubectl delete namespace ecommerce || true
        sleep 30

    # -------------------------------
    # DELETE ARGOCD (SAFE)
    # -------------------------------
    - name: Delete ArgoCD Namespace
      continue-on-error: true
      run: |
        kubectl delete namespace argocd || true
        sleep 30

    # -------------------------------
    # DELETE NODEGROUP
    # -------------------------------
    - name: Delete Nodegroup
      continue-on-error: true
      run: |
        aws eks delete-nodegroup \
          --cluster-name $CLUSTER_NAME \
          --nodegroup-name $NODEGROUP_NAME || true

    - name: Wait Nodegroup Delete
      continue-on-error: true
      run: |
        aws eks wait nodegroup-deleted \
          --cluster-name $CLUSTER_NAME \
          --nodegroup-name $NODEGROUP_NAME || true

    # -------------------------------
    # FINAL DESTROY
    # -------------------------------
    - name: Terraform Destroy
      run: terraform destroy -auto-approve
