name: 🔥 EKS ZERO-MANUAL DESTROY PIPELINE

on:
  workflow_dispatch:

concurrency:
  group: eks-destroy-main
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    env:
      AWS_REGION: ap-south-1
      CLUSTER_NAME: aws_eks-eks
      NODEGROUP_NAME: aws_eks-eks-nodes

    steps:

    - uses: actions/checkout@v4

    - uses: hashicorp/setup-terraform@v3
    - uses: azure/setup-kubectl@v4

    - uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Terraform Init
      run: terraform init

    - name: Configure kubeconfig
      continue-on-error: true
      run: |
        aws eks update-kubeconfig \
          --region $AWS_REGION \
          --name $CLUSTER_NAME || true

    # 🔥 CRITICAL FIX (ARGO FULL CLEAN)
    - name: 🔥 Force Delete ArgoCD COMPLETELY
      continue-on-error: true
      run: |
        echo "🔥 Deleting ArgoCD apps..."
        kubectl delete applications --all -n argocd || true

        echo "🔥 Deleting argocd namespace..."
        kubectl delete namespace argocd --grace-period=0 --force || true

        sleep 30

        echo "🔥 Removing CRDs..."
        kubectl get crds | grep argoproj | awk '{print $1}' | xargs -r kubectl delete crd || true

    # 🔥 APP CLEAN
    - name: Delete Ecommerce Namespace
      continue-on-error: true
      run: |
        kubectl delete namespace ecommerce --grace-period=0 --force || true
        sleep 30

    # 🔥 CLEAN ELB
    - name: Cleanup LoadBalancers
      continue-on-error: true
      run: |
        aws elbv2 describe-load-balancers \
          --query "LoadBalancers[].LoadBalancerArn" \
          --output text | \
        xargs -r -n1 aws elbv2 delete-load-balancer --load-balancer-arn || true

    # 🔥 CLEAN EBS
    - name: Cleanup EBS
      continue-on-error: true
      run: |
        aws ec2 describe-volumes \
          --query "Volumes[?State=='available'].VolumeId" \
          --output text | \
        xargs -r -n1 aws ec2 delete-volume --volume-id || true

    # 🔥 NODEGROUP
    - name: Delete Nodegroup
      continue-on-error: true
      run: |
        aws eks delete-nodegroup \
          --cluster-name $CLUSTER_NAME \
          --nodegroup-name $NODEGROUP_NAME || true

    - name: Wait Nodegroup Delete
      continue-on-error: true
      run: |
        aws eks wait nodegroup-deleted \
          --cluster-name $CLUSTER_NAME \
          --nodegroup-name $NODEGROUP_NAME || true

    - name: Wait stabilization
      run: sleep 60

    # 🔥 FINAL DESTROY
    - name: Terraform Destroy
      run: |
        timeout 1200 terraform destroy -auto-approve || true
