name: EKS Deploy Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.tf'
      - 'modules/**'
      - 'platform/**'
      - 'argocd/**'
      - '.github/workflows/deploy.yml'

concurrency:
  group: eks-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Terraform Apply + EKS Bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      AWS_REGION: ap-south-1
      TF_IN_AUTOMATION: true
      TF_INPUT: false
      CLUSTER_NAME: aws_eks-eks
      NODEGROUP_NAME: aws_eks-eks-nodes

    steps:
      ############################################
      # CHECKOUT
      ############################################
      - name: Checkout Repository
        uses: actions/checkout@v4

      ############################################
      # TOOLING
      ############################################
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      ############################################
      # AWS AUTH
      ############################################
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      ############################################
      # PRE-FLIGHT AWS SNAPSHOT
      ############################################
      - name: Pre-Deploy AWS Snapshot
        continue-on-error: true
        run: |
          echo "===== EXISTING EKS CLUSTER ====="
          aws eks describe-cluster --name $CLUSTER_NAME --region $AWS_REGION || true

          echo "===== EXISTING NODEGROUP ====="
          aws eks describe-nodegroup \
            --cluster-name $CLUSTER_NAME \
            --nodegroup-name $NODEGROUP_NAME \
            --region $AWS_REGION || true

          echo "===== AUTO SCALING GROUPS ====="
          aws autoscaling describe-auto-scaling-groups --region $AWS_REGION || true

          echo "===== EC2 INSTANCES ====="
          aws ec2 describe-instances \
            --region $AWS_REGION \
            --filters "Name=instance-state-name,Values=pending,running,stopping,stopped" || true

      ############################################
      # TERRAFORM
      ############################################
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Upload Terraform Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      ############################################
      # AWS STABILIZATION BUFFER
      ############################################
      - name: Wait for AWS Resource Stabilization
        run: |
          echo "⏳ Waiting for AWS resources to stabilize..."
          sleep 60

      ############################################
      # WAIT FOR EKS CONTROL PLANE
      ############################################
      - name: Wait for EKS Cluster to Become ACTIVE
        run: |
          echo "⏳ Waiting for EKS cluster to become ACTIVE..."
          aws eks wait cluster-active \
            --region $AWS_REGION \
            --name $CLUSTER_NAME
          echo "✅ EKS cluster is ACTIVE"

      ############################################
      # KUBECONFIG
      ############################################
      - name: Configure kubeconfig
        run: |
          echo "🔧 Configuring kubeconfig..."
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $CLUSTER_NAME

      ############################################
      # WAIT FOR NODEGROUP
      ############################################
      - name: Wait for Node Group to Become ACTIVE
        run: |
          echo "⏳ Waiting for EKS node group to become ACTIVE..."
          aws eks wait nodegroup-active \
            --region $AWS_REGION \
            --cluster-name $CLUSTER_NAME \
            --nodegroup-name $NODEGROUP_NAME
          echo "✅ Node group is ACTIVE"

      ############################################
      # EXTRA BUFFER FOR ASG / EC2 / NODE BOOTSTRAP
      ############################################
      - name: Wait for EC2 Worker Bootstrap
        run: |
          echo "⏳ Waiting for EC2 worker nodes to fully bootstrap..."
          sleep 120

      ############################################
      # WAIT FOR K8S NODES TO APPEAR
      ############################################
      - name: Wait for Kubernetes Nodes to Join
        run: |
          echo "⏳ Waiting for Kubernetes nodes to join cluster..."
          SUCCESS=false

          for i in {1..30}; do
            NODE_COUNT=$(kubectl get nodes --no-headers 2>/dev/null | wc -l || echo 0)
            echo "Attempt $i: Found $NODE_COUNT node(s)"

            if [ "$NODE_COUNT" -ge 1 ]; then
              SUCCESS=true
              break
            fi

            echo "Retrying in 20 seconds..."
            sleep 20
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "❌ No Kubernetes nodes joined the cluster in time"
            kubectl get nodes || true
            exit 1
          fi

      ############################################
      # WAIT FOR ALL NODES READY
      ############################################
      - name: Wait for All Nodes to Become Ready
        run: |
          echo "⏳ Waiting for all nodes to become Ready..."
          kubectl wait --for=condition=Ready nodes --all --timeout=900s
          echo "✅ All nodes are Ready"

      ############################################
      # CLUSTER DEBUG SNAPSHOT
      ############################################
      - name: Cluster Debug Snapshot
        run: |
          echo "===== EKS CLUSTER ====="
          aws eks describe-cluster \
            --name $CLUSTER_NAME \
            --region $AWS_REGION \
            --query "cluster.status"

          echo "===== NODEGROUP ====="
          aws eks describe-nodegroup \
            --cluster-name $CLUSTER_NAME \
            --nodegroup-name $NODEGROUP_NAME \
            --region $AWS_REGION \
            --query "nodegroup.status"

          echo "===== KUBERNETES NODES ====="
          kubectl get nodes -o wide

          echo "===== SYSTEM PODS ====="
          kubectl get pods -A

      ############################################
      ############################################
      # CLEAN OLD ARGOCD (SAFE)
      ############################################
      - name: Cleanup ArgoCD Namespace
        run: |
          echo "🔥 Cleaning ArgoCD namespace..."

          kubectl delete namespace argocd --ignore-not-found=true
          kubectl wait --for=delete namespace/argocd --timeout=120s || true


      ############################################
      # INSTALL ARGOCD USING HELM (BEST PRACTICE)
      ############################################
      - name: Install ArgoCD via Helm
        run: |
          echo "🚀 Installing ArgoCD using Helm..."

          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update

          helm upgrade --install argocd argo/argo-cd \
            --namespace argocd \
            --create-namespace \
            --wait \
            --timeout 10m

      ############################################
      # VERIFY ARGOCD
      ############################################
      - name: Wait for ArgoCD Pods Ready
        run: |
          echo "⏳ Verifying ArgoCD..."

          kubectl wait --for=condition=Ready pods \
            -l app.kubernetes.io/part-of=argocd \
            -n argocd \
            --timeout=900s
      ############################################
      # DEBUG (VERY IMPORTANT)
      ############################################
      - name: ArgoCD Debug Snapshot
        if: always()
        run: |
          echo "===== ARGOCD PODS ====="
          kubectl get pods -n argocd -o wide || true

          echo "===== ARGOCD EVENTS ====="
          kubectl get events -n argocd --sort-by=.metadata.creationTimestamp || true

      ############################################
      # DEPLOY GITOPS APP
      ############################################
      - name: Apply ArgoCD App
        run: |
          kubectl apply -f argocd/app.yaml
          
      ############################################
      # FINAL STATUS
      ############################################
      - name: Final Cluster Status
        if: always()
        run: |
          echo "===== FINAL NODES ====="
          kubectl get nodes -o wide || true

          echo "===== FINAL PODS ====="
          kubectl get pods -A || true

          echo "===== ARGOCD PODS ====="
          kubectl get pods -n argocd || true

          echo "===== SERVICES ====="
          kubectl get svc -A || true

          echo "===== INGRESS ====="
          kubectl get ingress -A || true

          echo "===== NODEGROUP FINAL STATUS ====="
          aws eks describe-nodegroup \
            --cluster-name $CLUSTER_NAME \
            --nodegroup-name $NODEGROUP_NAME \
            --region $AWS_REGION || true

          echo "===== EC2 FINAL ====="
          aws ec2 describe-instances \
            --region $AWS_REGION \
            --filters "Name=instance-state-name,Values=pending,running,stopping,stopped" || true
