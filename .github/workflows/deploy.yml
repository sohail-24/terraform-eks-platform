name: EKS Deploy Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.tf'
      - 'modules/**'
      - 'platform/**'
      - 'argocd/**'
      - '.github/workflows/deploy.yml'

concurrency:
  group: eks-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Terraform Apply + EKS Bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      AWS_REGION: ap-south-1
      TF_IN_AUTOMATION: true
      TF_INPUT: false

    steps:
      ############################################
      # CHECKOUT
      ############################################
      - name: Checkout Repository
        uses: actions/checkout@v4

      ############################################
      # TOOLING
      ############################################
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      ############################################
      # AWS AUTH
      ############################################
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      ############################################
      # TERRAFORM
      ############################################
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Upload Terraform Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      ############################################
      # WAIT FOR EKS CONTROL PLANE
      ############################################
      - name: Wait for EKS Cluster to Become ACTIVE
        run: |
          echo "⏳ Waiting for EKS cluster to become ACTIVE..."
          aws eks wait cluster-active \
            --region $AWS_REGION \
            --name aws_eks-eks
          echo "✅ EKS cluster is ACTIVE"

      ############################################
      # KUBECONFIG
      ############################################
      - name: Configure kubeconfig
        run: |
          echo "🔧 Configuring kubeconfig..."
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name aws_eks-eks

      ############################################
      # WAIT FOR NODEGROUP
      ############################################
      - name: Wait for Node Group to Become ACTIVE
        run: |
          echo "⏳ Waiting for EKS node group to become ACTIVE..."
          aws eks wait nodegroup-active \
            --region $AWS_REGION \
            --cluster-name aws_eks-eks \
            --nodegroup-name aws_eks-eks-nodes
          echo "✅ Node group is ACTIVE"

      ############################################
      # WAIT FOR K8S NODES
      ############################################
      - name: Wait for Kubernetes Nodes to Join
        run: |
          echo "⏳ Waiting for Kubernetes nodes to join cluster..."
          for i in {1..30}; do
            kubectl get nodes && break
            echo "Retrying in 20 seconds..."
            sleep 20
          done

      - name: Wait for All Nodes to Become Ready
        run: |
          echo "⏳ Waiting for all nodes to become Ready..."
          kubectl wait --for=condition=Ready nodes --all --timeout=600s
          echo "✅ All nodes are Ready"

      ############################################
      # DEBUG SNAPSHOT
      ############################################
      - name: Cluster Debug Snapshot
        run: |
          echo "===== EKS CLUSTER ====="
          aws eks describe-cluster --name aws_eks-eks --region $AWS_REGION --query "cluster.status"

          echo "===== NODEGROUP ====="
          aws eks describe-nodegroup \
            --cluster-name aws_eks-eks \
            --nodegroup-name aws_eks-eks-nodes \
            --region $AWS_REGION \
            --query "nodegroup.status"

          echo "===== KUBERNETES NODES ====="
          kubectl get nodes -o wide

          echo "===== SYSTEM PODS ====="
          kubectl get pods -A

      ############################################
      # INSTALL ARGOCD
      ############################################
      - name: Install ArgoCD Namespace
        run: |
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -

      - name: Install ArgoCD
        run: |
          kubectl apply -n argocd \
            -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

      - name: Wait for ArgoCD Server Deployment
        run: |
          echo "⏳ Waiting for ArgoCD server..."
          kubectl rollout status deployment/argocd-server -n argocd --timeout=600s

      - name: Wait for ArgoCD Application Controller
        run: |
          echo "⏳ Waiting for ArgoCD application controller..."
          kubectl rollout status deployment/argocd-applicationset-controller -n argocd --timeout=600s || true
          kubectl rollout status statefulset/argocd-application-controller -n argocd --timeout=600s || true

      ############################################
      # DEPLOY GITOPS APP
      ############################################
      - name: Apply ArgoCD App
        run: kubectl apply -f argocd/app.yaml

      ############################################
      # FINAL STATUS
      ############################################
      - name: Final Cluster Status
        if: always()
        run: |
          echo "===== FINAL NODES ====="
          kubectl get nodes -o wide || true

          echo "===== FINAL PODS ====="
          kubectl get pods -A || true

          echo "===== ARGOCD PODS ====="
          kubectl get pods -n argocd || true

          echo "===== SERVICES ====="
          kubectl get svc -A || true

          echo "===== INGRESS ====="
          kubectl get ingress -A || true
